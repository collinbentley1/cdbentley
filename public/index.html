<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Collin — The Journey</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div id="wrap" aria-label="Collin Bentley journey">
      <main id="stage">
        <header id="banner">
          <div class="kicker">★ A WILD PORTFOLIO APPEARED ★</div>
          <h1>COLLIN</h1>
        </header>
        <div id="scrollHint">follow the route down <span class="arrow">↓</span></div>

        <div id="bubble">Hi, I'm Collin<span class="cursor">!</span></div>
        <div id="trainer" aria-hidden="true">
          <div class="shadow"></div>
          <div class="tag">▶ TRAINER · LV.∞</div>
        </div>

        <svg id="routeSvg" aria-hidden="true">
          <defs>
            <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" baseFrequency="0.013 0.018" numOctaves="2" seed="7" result="n"></feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
            </filter>
          </defs>
          <path id="routeShadow"></path>
          <path id="route"></path>
        </svg>

        <footer id="endmark">
          <div class="star">✦</div>
          <div class="tbc">to be continued…</div>
          <div class="sub">THE STORY KEEPS LEVELING UP</div>
        </footer>
      </main>
    </div>

    <main id="mroot" aria-label="Collin Bentley journey"></main>

    <script type="module" src="/assets/client.js"></script>
  </body>
</html>
