name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 6498b00eccbed6069460ffd1ad47a70048762bae
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@6498b00eccbed6069460ffd1ad47a70048762bae
