name: Bun verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pull_request:
        required: false
        type: string

permissions: {}

jobs:
  run:
    name: Bun verify
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      pull_request: ${{ inputs.pull_request || '' }}
      platform_sha: 405f9c15c4fe7f50ad5ff2ffd3b600f171c65d68
    uses: collinbentley1/platform/.github/workflows/application-v1.yml@405f9c15c4fe7f50ad5ff2ffd3b600f171c65d68
