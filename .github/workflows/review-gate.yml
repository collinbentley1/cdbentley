name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      platform_sha: 6498b00eccbed6069460ffd1ad47a70048762bae
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@6498b00eccbed6069460ffd1ad47a70048762bae
