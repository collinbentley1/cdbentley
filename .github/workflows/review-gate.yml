name: Automated review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  run:
    name: Automated review
    permissions:
      contents: read
      pull-requests: read
      checks: write
    with:
      platform_sha: 405f9c15c4fe7f50ad5ff2ffd3b600f171c65d68
    uses: collinbentley1/platform/.github/workflows/review-gate-v1.yml@405f9c15c4fe7f50ad5ff2ffd3b600f171c65d68
