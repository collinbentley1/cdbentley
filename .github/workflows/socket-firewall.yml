name: Socket Firewall

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - pnpm-lock.yaml
      - yarn.lock
      - .github/workflows/socket-firewall.yml
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - pnpm-lock.yaml
      - yarn.lock
      - .github/workflows/socket-firewall.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firewall:
    name: Socket Firewall
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Socket Firewall
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall

      - name: Run install through Socket Firewall
        run: |
          set -euo pipefail

          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            sfw npm ci --ignore-scripts
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            sfw pnpm install --frozen-lockfile --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable
            sfw yarn install --immutable --ignore-scripts || sfw yarn install --frozen-lockfile --ignore-scripts
          elif [ -f package.json ]; then
            sfw npm install --package-lock-only --ignore-scripts
          else
            echo "No supported package manifest or lockfile found; skipping Socket Firewall install check."
          fi

