name: Deploy production

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write # Prove exact-SHA WIF and read cloud metadata for convergence only.
    uses: collinbentley1/platform/.github/workflows/infrastructure.yml@52cb2dea765ead93f204ee4a5bd884b9fbb0f13a

  deploy:
    needs: infrastructure
    # Runs whatever infrastructure concluded: the reusable workflow delivers each job's credential to the
    # protected-recovery broker first and then requires the convergence job of this run to have succeeded
    # before any exchange, so a quarantine -- under which convergence fails -- still gets every delivery.
    if: always()
    permissions:
      actions: read # Download the SBOM artifact produced by this workflow run.
      attestations: write # Publish provenance and SBOM attestations for the copied digest.
      contents: read
      id-token: write # Exchange only through exact production publish and deploy paths.
      pull-requests: read # The reusable deploy proves every live preview tag maps to an active PR head.
    uses: collinbentley1/platform/.github/workflows/deploy-prod.yml@52cb2dea765ead93f204ee4a5bd884b9fbb0f13a
