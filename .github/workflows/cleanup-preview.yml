name: Cleanup preview
run-name: recovery-event-${{ github.event.action }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    permissions:
      actions: read # Download only the exact prefetch artifact id the reusable workflow produces.
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Let the reusable cleanup re-read current lifecycle state.
    uses: collinbentley1/platform/.github/workflows/cleanup-preview.yml@52cb2dea765ead93f204ee4a5bd884b9fbb0f13a
