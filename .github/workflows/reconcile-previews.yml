name: Reconcile previews
run-name: ${{ inputs.delivery_nonce && format('recovery-dispatch-{0}', inputs.delivery_nonce) || github.workflow }}

# checkov:skip=CKV_GHA_7:delivery_nonce labels only the run name for lost-response recovery and cannot reach jobs.
on:
  push:
    branches:
      - main
  schedule:
    # Reconcile hourly even though mutation jobs use the bounded FIFO queue;
    # this is the durable backstop for interrupted or externally drifted runs.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      delivery_nonce:
        description: Correlation nonce for a protected recovery delivery round.
        required: false
        type: string

permissions: {}

jobs:
  reconcile:
    permissions:
      actions: read # Download only the exact prefetch artifact id the reusable workflow produces.
      id-token: write # Exchange only for the exact-SHA preview traffic operator.
      pull-requests: read # Compare live tags with authoritative pull-request heads.
    secrets:
      DHI_PUBLIC_READ_TOKEN_20260822_098DCA9280B3: ${{ secrets.DHI_PUBLIC_READ_TOKEN_20260822_098DCA9280B3 }}
    uses: collinbentley1/platform/.github/workflows/reconcile-previews.yml@f857a58e3ecac63b2b3882809efbfb7136bfa6c3
